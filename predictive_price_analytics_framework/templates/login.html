{% extends 'base.html' %}

{% block title %}Sign In - SmartPrice{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-chart-line text-primary fs-1 mb-2"></i>
                    <h4 class="fw-bold">Sign In to SmartPrice</h4>
                    <p class="text-muted small">Access your saved alerts and price tracking</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" value="student@smartprice.edu" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" value="demo123" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold">Sign In</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
