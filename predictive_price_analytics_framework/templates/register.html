{% extends 'base.html' %}

{% block title %}Register - SmartPrice{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-user-plus text-primary fs-1 mb-2"></i>
                    <h4 class="fw-bold">Create Account</h4>
                    <p class="text-muted small">Start tracking multi-platform product deals</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold">Register Account</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <small class="text-muted">Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Sign In</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
